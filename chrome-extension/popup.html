<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek → DS2API</title>
    <style>
      :root {
        --bg: #141416;
        --card: #1e1e22;
        --border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --muted: #a1a1aa;
        --accent: #9cbbd4;
        --ok: #58c08a;
        --err: #e08585;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }
      .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 2px; }
      .logo { width: 26px; height: 26px; flex: 0 0 auto; }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .sub { color: var(--muted); font-size: 11px; margin: 0 0 14px; }
      label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
      input {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 8px 10px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: border-color 0.3s;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button {
        width: 100%;
        margin-top: 14px;
        background: var(--accent);
        color: #10212b;
        border: none;
        border-radius: 999px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }
      button:hover { transform: translateY(-1px); filter: brightness(1.05); }
      button:active { transform: translateY(0); }
      .status {
        margin-top: 12px;
        padding: 9px 11px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        min-height: 16px;
        word-break: break-word;
      }
      .status.ok { color: var(--ok); border-color: rgba(88, 192, 138, 0.3); }
      .status.err { color: var(--err); border-color: rgba(224, 133, 133, 0.3); }
      .hint { margin-top: 12px; font-size: 10.5px; color: var(--muted); }
      .hint a { color: var(--accent); text-decoration: none; }
      .hint a:hover { text-decoration: underline; }
      kbd {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 5px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg class="logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#c7deef" /><stop offset="0.55" stop-color="#9cbbd4" /><stop offset="1" stop-color="#7ba0c2" />
          </linearGradient>
          <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#17313f" /><stop offset="1" stop-color="#0d1b24" />
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#tile)" />
        <g fill="none" stroke="url(#arrow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <line x1="35" y1="64" x2="82" y2="64" /><polyline points="64,45 85,64 64,83" />
        </g>
        <circle cx="35" cy="64" r="8.5" fill="url(#arrow)" />
      </svg>
      <h1>DeepSeek → DS2API</h1>
    </div>
    <p class="sub">Push your DeepSeek token + cookies into the local proxy.</p>

    <label for="proxy">Proxy URL</label>
    <input id="proxy" type="text" spellcheck="false" placeholder="http://127.0.0.1:8080" />

    <label for="label">Account label (auto-numbered)</label>
    <input id="label" type="text" spellcheck="false" placeholder="deepseek" />

    <button id="push">Push now</button>

    <div id="status" class="status">Ready.</div>

    <p class="hint">
      Hotkey: <kbd id="hk">Ctrl/⌘ + Shift + Y</kbd> — change at
      <a id="shortcuts" href="#">chrome://extensions/shortcuts</a>
    </p>

    <script src="popup.js"></script>
  </body>
</html>
